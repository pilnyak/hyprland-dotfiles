# WINDOW MANAGEMENT KEYBINDINGS
bind = $mainMod, Q, killactive,
bind = $mainMod, F, togglefloating,

# MOUSE DRAG (floating windows)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, M, fullscreen, 1
bind = $mainMod SHIFT, M, fullscreen, 0
bind = $mainMod, bracketleft, splitratio, -0.05
bind = $mainMod, bracketright, splitratio, +0.05

# WINDOW FOCUS
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# WINDOW MOVEMENT
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# SIZE ADJUSTMENT
bind = $mainMod, T, exec, hyprctl dispatch workspaceopt allfloat && sleep 0.1 && hyprctl dispatch workspaceopt allfloat
bind = $mainMod, R, submap, resize
submap = resize

binde = , l, resizeactive, 20 0
binde = , h, resizeactive, -20 0
binde = , k, resizeactive, 0 -20
binde = , j, resizeactive, 0 20

bind = , escape, submap, reset
submap = reset

# WINDOW GROUPING (tabbed windows)
bind = $mainMod, G, togglegroup,                    # Create/dissolve group
bind = $mainMod, Tab, changegroupactive, f          # Next tab in group
bind = $mainMod SHIFT, Tab, changegroupactive, b    # Previous tab in group
bind = $mainMod SHIFT, G, moveoutofgroup,           # Remove from group
bind = $mainMod CTRL, h, moveintogroup, l           # Move into group left
bind = $mainMod CTRL, l, moveintogroup, r           # Move into group right
bind = $mainMod CTRL, k, moveintogroup, u           # Move into group up
bind = $mainMod CTRL, j, moveintogroup, d           # Move into group down
