source = $HOME/.config/hypr/config/variables.conf

# DIALOG WINDOW RULES
windowrule = match:title ^(Open File)(.*)$, float on
windowrule = match:title ^(Select a File)(.*)$, float on
windowrule = match:title ^(Choose wallpaper)(.*)$, float on
windowrule = match:title ^(Open Folder)(.*)$, float on
windowrule = match:title ^(Save As)(.*)$, float on
windowrule = match:title ^(Library)(.*)$, float on
windowrule = match:title ^(File Upload)(.*)$, float on
windowrule = match:title ^(File Operation Progress)$, float on
windowrule = match:title ^(Confirm to replace files)$, float on
windowrule = match:class ^($browser)$, match:title .*accounts.*, float on

# File dialogs with specific sizes
windowrule = match:class ^(firefox|google-chrome|zen)$, match:title ^(Save As)$, size 800 600
windowrule = match:class ^(firefox|google-chrome|zen)$, match:title ^(Choose Files)$, size 800 600
windowrule = match:class ^(firefox|google-chrome|zen)$, match:title ^(Open File)$, size 800 600
windowrule = match:class ^(firefox|google-chrome|zen)$, match:title ^(Open Folder)$, size 800 600

# APPLICATION-SPECIFIC DIALOGS
# qView image viewer
windowrule = match:class ^(com.interversehq.qView)$, size 800 450
# fullscreenstate rule removed - deprecated in 0.53
windowrule = match:class ^(com.interversehq.qView)$, content photo
windowrule = match:class ^(com.interversehq.qView)$, no_blur on