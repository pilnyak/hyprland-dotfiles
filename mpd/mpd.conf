# MPD Configuration
music_directory    "~/Music"
playlist_directory "~/.config/mpd/playlists"
db_file            "~/.local/share/mpd/database"
state_file         "~/.local/share/mpd/state"
sticker_file       "~/.local/share/mpd/sticker.sql"

# Audio output (PipeWire/PulseAudio)
audio_output {
    type  "pipewire"
    name  "PipeWire Sound Server"
}

# Fallback to PulseAudio if PipeWire fails (disabled by default)
audio_output {
    type    "pulse"
    name    "PulseAudio"
    enabled "no"
}

# For visualizers (cava, ncmpcpp)
audio_output {
    type   "fifo"
    name   "Visualizer"
    path   "/tmp/mpd.fifo"
    format "44100:16:2"
}

# Better audio quality for FLACs
audio_output_format "44100:16:2"
replaygain         "auto"

# Network
bind_to_address "127.0.0.1"
port            "6600"

# Performance
auto_update     "yes"
