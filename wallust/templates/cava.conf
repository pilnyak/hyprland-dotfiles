# CAVA - Console-based Audio Visualizer for ALSA
# Colors dynamically generated by wallust

[general]
framerate = 60
autosens = 1
sensitivity = 100
bars = 0
bar_width = 4
bar_spacing = 2
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = noncurses
channels = stereo
mono_option = average
orientation = bottom
waveform = 0

[smoothing]
monstercat = 0
waves = 0
noise_reduction = 91

[eq]
1 = 1
2 = 1
3 = 1
4 = 1
5 = 1

[color]
background = default
foreground = default

gradient = 1
gradient_count = 8
gradient_color_1 = '{{color1}}'
gradient_color_2 = '{{color2}}'
gradient_color_3 = '{{color3}}'
gradient_color_4 = '{{color4}}'
gradient_color_5 = '{{color5}}'
gradient_color_6 = '{{color6}}'
gradient_color_7 = '{{color7}}'
gradient_color_8 = '{{color15}}'
